# Use https://app.stepsecurity.io/ to improve workflow security
name: Create Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  testing:
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: oldstable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install
      run: make install

    - name: Check
      run: make check

  create_release:
    permissions:
      contents: write
    name: Create Release
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
    - name: Ensure GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "Release $TAG already exists — reusing"
        else
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Release $TAG" \
            --prerelease
        fi

  publish:
    permissions:
      contents: write
    name: Publish
    needs: [testing, create_release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: oldstable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install
      run: make install

    - name: Distribute
      run: make dist

    - name: Upload release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Linux" ]; then
          asset=./bin/iso8583-linux-amd64
        elif [ "$RUNNER_OS" = "macOS" ]; then
          asset=./bin/iso8583-darwin-amd64
        else
          asset=./bin/iso8583.exe
        fi
        gh release upload "$TAG" "$asset" --repo "$REPO" --clobber

  docker:
    # temporarily skip the creation of docker image with fuzz testing
    if: false
    name: Docker
    needs: [testing, create_release]
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: oldstable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install
      run: make install

    - name: Docker
      run: make docker

    - name: Docker Push
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        make docker-push
